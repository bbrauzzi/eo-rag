<text x="46" y="489" fill="#656d76" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0">S3 state bucket (made by hand) · ECR repository</text>
