<text x="262" y="358" fill="#656d76" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="1.0">db.t4g.micro · 20 GB · single-AZ · publicly_accessible = false</text>
<text x="262" y="375" fill="#9a6700" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="1.0">destroyed every cycle — deploy.sh re-runs ingestion</text>
