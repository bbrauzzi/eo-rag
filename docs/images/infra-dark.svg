<text x="574" y="489" fill="#8b949e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0">ALB · ECS · RDS · Secrets Manager · IAM</text>
<text x="574" y="508" fill="#8b949e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0">Destroyed when you are done; billing stops. Redeploy is one</text>
<text x="574" y="523" fill="#8b949e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0">command and reuses the image already in ECR.</text>
