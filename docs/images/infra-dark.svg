<text x="262" y="358" fill="#8b949e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" opacity="1.0">db.t4g.micro · 20 GB · single-AZ · publicly_accessible = false</text>
