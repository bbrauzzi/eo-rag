services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eo-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eorag
      POSTGRES_PASSWORD: eorag
      POSTGRES_DB: eorag
    ports:
      - "5432:5432"
    volumes:
      - eo_rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eorag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eo-rag-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./scripts:/app/scripts:ro  # dev tooling (retrieve_test.py); not baked into the image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


volumes:
  eo_rag_pg_data:
  
